name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 发布目录：仓库内的 release/（pnpm release 产出的单文件 index.html）
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./release

      - id: deployment
        uses: actions/deploy-pages@v4
