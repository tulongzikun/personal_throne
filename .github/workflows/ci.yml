name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段决定（pnpm@11.28.5），
      # 这里不能再写 version，否则 action-setup 会报 "Multiple versions of pnpm specified"。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 静态检查
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 测量快照（10 年，四类指标）
        run: pnpm measure --seed demo --years 10 --out .tmp/measure-demo.json

      - name: 构建单文件
        run: pnpm build

      - name: 生成发布产物并校验（单文件 / 无外链 / ≤1.5MiB）
        run: node scripts/release.mjs

      - name: 提交的 release/index.html 必须与构建一致
        run: git diff --exit-code -- release/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: throne-and-gold-html
          path: release/index.html
